name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Verify and publish @sutra/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: The tag must match packages/ui/package.json
        run: |
          pkg="$(node -p "require('./packages/ui/package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/ui/package.json version $pkg" >&2
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_ENV"

      - run: pnpm verify

      - name: Publish (pre-releases go to the "next" dist-tag)
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$version" in
            *-*) tag="next" ;;
            *) tag="latest" ;;
          esac
          pnpm publish --access public --provenance --no-git-checks --tag "$tag"
